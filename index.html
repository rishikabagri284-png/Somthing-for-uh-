<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something For You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd1e3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #6b2145;
        }

        .container {
            width: 90%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(154, 48, 91, 0.18);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 5;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.4s infinite;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
